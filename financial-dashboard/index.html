<script>
(async()=>{
  try{
    const b=atob(window.__DASH_GZIP_B64||'');

    const ds=new DecompressionStream('gzip');
    let text=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();

    const compact='<style id="compact-table-override">main{max-width:none!important;padding:20px 8px 60px!important}section{padding:12px!important}.desktop-table table{width:100%!important;min-width:980px!important;table-layout:fixed!important;font-size:10px!important}.desktop-table th,.desktop-table td{padding:5px 5px!important;line-height:1.15!important;overflow-wrap:anywhere!important;white-space:normal!important}.desktop-table thead th{position:static!important;top:auto!important;z-index:auto!important;min-width:0!important}.desktop-table thead .month-col{position:static!important}.desktop-table tbody td:nth-child(6),.desktop-table tbody td:nth-child(7),.desktop-table tbody td:nth-child(8),.desktop-table tbody td:nth-child(9),.desktop-table tbody td:nth-child(13),.desktop-table tbody td:nth-child(14),.desktop-table tbody td:nth-child(16),.desktop-table tbody td:nth-child(17),.desktop-table tbody td:nth-child(19),.desktop-table tbody td:nth-child(20),.desktop-table tbody td:nth-child(22){display:none!important}.desktop-table tbody .month-col{width:68px!important;min-width:68px!important;max-width:68px!important}.desktop-table .academy-cell{min-width:82px!important;width:82px!important}.desktop-table tbody td:nth-child(n+2):nth-child(-n+5) .line:first-child,.desktop-table tbody td:nth-child(n+2):nth-child(-n+5) .line:last-child{display:none!important}.desktop-table .academy-cell .line{display:block!important;margin:0!important}.desktop-table .academy-cell .line label{display:block!important;margin-bottom:2px!important;font-size:9px!important}.desktop-table .academy-cell .actual-input{width:100%!important;max-width:72px!important;box-sizing:border-box!important;padding:4px 3px!important}.desktop-table thead th:nth-child(6),.desktop-table tbody td:nth-child(10){width:44px!important;min-width:44px!important;max-width:44px!important}.desktop-table thead th:nth-child(8),.desktop-table tbody td:nth-child(12){width:44px!important;min-width:44px!important;max-width:44px!important}.desktop-table tbody td:nth-child(18){padding:0!important}.desktop-table tbody td:nth-child(18) .line{display:block!important;margin:0!important}.desktop-table tbody td:nth-child(18) .line span:first-child{display:none!important}.desktop-table .monthly-saving-input{display:block!important;width:100%!important;height:100%!important;min-height:42px!important;max-width:none!important;box-sizing:border-box!important;border:0!important;border-radius:0!important;padding:8px 6px!important;text-align:center!important;font-weight:800!important;background:transparent!important;color:inherit!important}.desktop-table .stratigo-input{width:72px!important;min-width:60px!important;max-width:100%!important;box-sizing:border-box!important}.desktop-table input.money-input{max-width:100%!important;box-sizing:border-box!important;font-size:10px!important}.desktop-table input.monthly-saving-input{font-size:20px!important;line-height:1!important;font-weight:800!important}.desktop-table td.saving-positive,.desktop-table td.balance-positive{background:#C8FFC8!important;color:#17333b!important}.desktop-table td.saving-negative,.desktop-table td.balance-negative{background:#FF3C41!important;color:#ffffff!important}.desktop-table td.saving-positive input,.desktop-table td.saving-negative input{background:transparent!important;color:inherit!important;-webkit-text-fill-color:currentColor!important}.desktop-table td.saving-positive input::placeholder{color:#35554f!important}.desktop-table td.saving-negative input::placeholder{color:#ffffff!important}.desktop-table tbody td:nth-child(15).balance-positive{font-size:20px!important;font-weight:800!important;line-height:1.1!important;text-align:center!important}.desktop-table tbody td:nth-child(15).balance-negative{font-size:13px!important;font-weight:400!important;line-height:1.15!important;text-align:center!important;background:#FF3C41!important;color:#ffffff!important}.desktop-table td[data-field="balanceFull"].variance-positive{background:#C8FFC8!important;color:#17333b!important;font-size:20px!important;font-weight:800!important;line-height:1.1!important;text-align:center!important}.desktop-table td[data-field="balanceFull"].variance-negative{background:#FF3C41!important;color:#ffffff!important;font-size:13px!important;font-weight:400!important;line-height:1.15!important;text-align:center!important}.table-wrap{max-height:none!important}.table-scrollbar{height:18px!important}@media(max-width:1200px) and (min-width:761px){.desktop-table table{min-width:920px!important;font-size:9px!important}.desktop-table th,.desktop-table td{padding:4px 3px!important}}</style>';

    const header='<thead><tr><th class="month-col">חודש</th><th>אוניברסיטת חיפה</th><th>לימודי חוץ חיפה</th><th>בצלאל</th><th>אוניברסיטת אריאל</th><th>שכר דירה נטו</th><th>Stratigo: שכר / משיכה</th><th>פנסיה + קה״ש</th><th>יתרה / גירעון</th><th>חיסכון בפועל בבנק לאומי</th><th>יתרת קרן Stratigo</th></tr></thead>';

    const painter='<script>(function(){function num(v){if(v==null)return NaN;var s=String(v).trim();if(!s)return NaN;s=s.replace(/[−–﹣－]/g,\'-\').replace(/₪/g,\'\').replace(/\\s/g,\'\').replace(/,/g,\'\');var m=s.match(/[+-]?\\d+(?:\\.\\d+)?/);return m?Number(m[0]):NaN}function stripNis(el){if(!el)return;var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);var n;while(n=w.nextNode()){if(n.parentElement&&/^(SCRIPT|STYLE)$/.test(n.parentElement.tagName))continue;if(n.nodeValue.indexOf(\'₪\')>-1)n.nodeValue=n.nodeValue.replace(/₪/g,\'\')}}function paintSaving(input){var td=input.closest(\'td\');if(!td)return;td.classList.remove(\'saving-positive\',\'saving-negative\');var v=num(input.value);if(Number.isFinite(v)){if(v>0)td.classList.add(\'saving-positive\');else if(v<0)td.classList.add(\'saving-negative\')}}function paintBalance(td){if(!td)return;td.classList.remove(\'balance-positive\',\'balance-negative\');if(td.classList.contains(\'variance-positive\'))td.classList.add(\'balance-positive\');else if(td.classList.contains(\'variance-negative\'))td.classList.add(\'balance-negative\')}function paintAll(){document.querySelectorAll(\'.monthly-saving-input\').forEach(paintSaving);document.querySelectorAll(\'.desktop-table tbody tr\').forEach(function(tr){var cells=tr.children;stripNis(cells[9]);stripNis(cells[14]);paintBalance(cells[14])})}document.addEventListener(\'input\',function(e){if(e.target&&e.target.matches(\'.monthly-saving-input\'))paintSaving(e.target)},true);document.addEventListener(\'change\',function(){setTimeout(paintAll,0)},true);var obs=new MutationObserver(function(){paintAll()});window.addEventListener(\'load\',function(){var body=document.getElementById(\'monthly-body\');if(body)obs.observe(body,{childList:true,subtree:true,characterData:true});paintAll()});setTimeout(paintAll,50)})();<\/script>';

    const persist='<script>(function(){const KEY=\'eduardoFinancialDashboardV3\';let restoring=false,timer=null;function n(s){return String(s||\'\').replace(/\\s+/g,\' \').trim()}function key(el){if(el.id)return "id:"+el.id;const tr=el.closest(\'tr\');if(tr){const first=tr.querySelector(\'td,th\');const month=n((tr.dataset&&tr.dataset.month)||(first&&first.textContent)||"row");const list=Array.from(tr.querySelectorAll(\'input,select,textarea\'));return "row:"+month+"|"+el.tagName+"|"+(el.name||"")+"|"+Array.from(el.classList).sort().join(\'.\')+"|"+list.indexOf(el)}const all=Array.from(document.querySelectorAll(\'input,select,textarea\'));return "global:"+el.tagName+"|"+(el.name||"")+"|"+Array.from(el.classList).sort().join(\'.\')+"|"+all.indexOf(el)}function read(){try{return JSON.parse(localStorage.getItem(KEY)||\'{}\')}catch(e){return {}}}function write(d){try{localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+\':last\',new Date().toISOString())}catch(e){console.error(\'finance autosave failed\',e)}}function saveOne(el){if(restoring||!el.matches(\'input,select,textarea\'))return;const d=read(),k=key(el);d[k]={v:el.type===\'checkbox\'?el.checked:el.value,type:el.type};write(d)}function saveAll(){document.querySelectorAll(\'input,select,textarea\').forEach(saveOne)}function restore(options){options=options||{};const d=read();if(!Object.keys(d).length)return;const active=document.activeElement;if(!options.force&&active&&active.matches&&active.matches(\'input,select,textarea\'))return;restoring=true;const changed=[];document.querySelectorAll(\'input,select,textarea\').forEach(function(el){if(el===active)return;const r=d[key(el)];if(!r)return;const v=r.type===\'checkbox\'?!!r.v:String(r.v==null?\'\':r.v);const cur=el.type===\'checkbox\'?el.checked:el.value;if(cur!==v){if(el.type===\'checkbox\')el.checked=v;else el.value=v;changed.push(el)}});restoring=false;if(options.notify){changed.forEach(function(el){el.dispatchEvent(new Event(\'change\',{bubbles:true}))})}}function schedule(){clearTimeout(timer);timer=setTimeout(function(){const active=document.activeElement;if(active&&active.matches&&active.matches(\'input,select,textarea\'))return;restore({notify:false})},350)}document.addEventListener(\'input\',function(e){saveOne(e.target)},true);document.addEventListener(\'change\',function(e){saveOne(e.target)},true);document.addEventListener(\'focusout\',function(){setTimeout(function(){restore({notify:false})},50)},true);window.addEventListener(\'beforeunload\',saveAll);window.addEventListener(\'pagehide\',saveAll);new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});window.addEventListener(\'load\',function(){restore({force:true,notify:true});setTimeout(function(){restore({notify:false})},500)});setTimeout(function(){restore({force:true,notify:true})},50);window.financeDashboardSaveNow=saveAll})();<\/script>';

    text=text.replace(/<thead>[\s\S]*?<\/thead>/,header);
    text=text.replace('</head>',compact+'</head>');
    text=text.replace('</body>',painter+persist+'</body>');
    document.open();
    document.write(text);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='שגיאה בטעינת הדשבורד';
    console.error(e);
  }
})();
</script>
